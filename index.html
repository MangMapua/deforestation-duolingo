<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duolingo Prototype</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #58cc02;
      --green-shadow: #46a302;
      --green-light: #d7ffb8;
      --red: #ff4b4b;
      --red-shadow: #ea2b2b;
      --red-light: #ffdadc;
      --blue: #1cb0f6;
      --blue-shadow: #1899d6;
      --gray: #e5e5e5;
      --gray-shadow: #afafaf;
      --gray-dark: #777;
      --card-selected-border: #84d8ff;
      --card-selected-bg: #ddf4ff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
      user-select: none;
    }

    body {
      margin: 0;
      background-color: #f7f7f7;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    /* Standard Duolingo 3D Button */
    .btn-3d {
      border: none;
      border-bottom: 4px solid var(--green-shadow);
      background-color: var(--green);
      color: white;
      font-weight: 800;
      border-radius: 16px;
      padding: 14px 24px;
      font-size: 16px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: filter 0.1s, transform 0.1s, border-width 0.1s;
    }

    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .btn-3d:disabled {
      background-color: var(--gray);
      border-bottom-color: var(--gray-shadow);
      cursor: not-allowed;
      color: #999;
    }

    /* --- PATH SCREEN --- */
    #path-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .path-header {
      padding: 16px;
      border-bottom: 2px solid var(--gray);
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      color: #4b4b4b;
    }

    .path-container {
      flex: 1;
      overflow-y: auto;
      padding: 40px 0;
      display: flex;
      flex-direction: column-reverse; /* Reverses direction so Level 1 starts at the bottom */
      align-items: center;
      gap: 32px;
    }

    /* Level Nodes Setup */
    .level-node {
      width: 80px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      cursor: pointer;
      position: relative;
      border-bottom: 8px solid;
      transition: transform 0.1s;
    }

    .level-node:active {
      transform: translateY(4px) !important;
      border-bottom-width: 4px !important;
    }

    .level-node.unlocked {
      background-color: var(--green);
      border-color: var(--green-shadow);
      color: white;
    }

    .level-node.locked {
      background-color: var(--gray);
      border-color: var(--gray-shadow);
      color: var(--gray-dark);
      cursor: not-allowed;
    }

    .level-node.completed {
      background-color: var(--blue);
      border-color: var(--blue-shadow);
      color: white;
    }

    /* Zigzag path offset pattern */
    .level-node:nth-child(4n+1) { transform: translateX(0); }
    .level-node:nth-child(4n+2) { transform: translateX(45px); }
    .level-node:nth-child(4n+3) { transform: translateX(0); }
    .level-node:nth-child(4n+4) { transform: translateX(-45px); }

    /* --- QUIZ SCREEN --- */
    #quiz-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .quiz-header {
      padding: 20px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--gray-shadow);
      cursor: pointer;
      font-weight: 900;
    }

    .progress-bar-container {
      flex: 1;
      height: 16px;
      background-color: var(--gray);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--green);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .quiz-body {
      flex: 1;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
    }

    .question-title {
      font-size: 22px;
      font-weight: 800;
      color: #3c3c3c;
      margin-bottom: 24px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option-card {
      border: 2px solid var(--gray);
      border-bottom: 4px solid var(--gray);
      border-radius: 16px;
      padding: 20px 12px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #4b4b4b;
      cursor: pointer;
      transition: all 0.1s;
    }

    .option-card:hover {
      background-color: #f7f7f7;
    }

    .option-card.selected {
      border-color: var(--card-selected-border);
      border-bottom-color: var(--blue-shadow);
      background-color: var(--card-selected-bg);
      color: var(--blue);
    }

    /* Quiz Footer */
    .quiz-footer {
      padding: 24px 16px;
      border-top: 2px solid var(--gray);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: background-color 0.2s;
    }

    .quiz-footer.correct {
      background-color: var(--green-light);
      border-top-color: transparent;
    }

    .quiz-footer.incorrect {
      background-color: var(--red-light);
      border-top-color: transparent;
    }

    .feedback-text {
      font-size: 20px;
      font-weight: 800;
      display: none;
    }

    .quiz-footer.correct .feedback-text {
      display: block;
      color: var(--green-shadow);
    }

    .quiz-footer.incorrect .feedback-text {
      display: block;
      color: var(--red-shadow);
    }

    .quiz-footer button {
      width: 100%;
    }

    .btn-red {
      background-color: var(--red);
      border-bottom-color: var(--red-shadow);
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- LEVEL SELECTOR (PATH SCREEN) -->
  <div id="path-screen">
    <div class="path-header">General Knowledge Path</div>
    <div class="path-container" id="path-container">
      <!-- Generated dynamically by JS -->
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen">
    <div class="quiz-header">
      <button class="close-btn" onclick="exitQuiz()">✕</button>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="quiz-body">
      <div class="question-title" id="question-text">Question goes here?</div>
      <div class="options-grid" id="options-grid">
        <!-- Generated dynamically by JS -->
      </div>
    </div>

    <div class="quiz-footer" id="quiz-footer">
      <div class="feedback-text" id="feedback-text"></div>
      <button class="btn-3d" id="action-btn" disabled onclick="handleAction()">Check</button>
    </div>
  </div>
</div>

<script>
  // --- DATA STRUCTURE ---
  const levels = [
    {
      id: 1,
      name: "Level 1",
      unlocked: true,
      completed: false,
      questions: [
        {
          question: "Which planet is known as the Red Planet?",
          options: ["Earth", "Mars", "Jupiter", "Venus"],
          correct: 1
        },
        {
          question: "What is the capital of France?",
          options: ["Berlin", "Madrid", "Paris", "Rome"],
          correct: 2
        }
      ]
    },
    {
      id: 2,
      name: "Level 2",
      unlocked: false,
      completed: false,
      questions: [
        {
          question: "Which element has the chemical symbol 'O'?",
          options: ["Gold", "Oxygen", "Osmium", "Silver"],
          correct: 1
        },
        {
          question: "How many legs does a spider have?",
          options: ["6", "8", "10", "12"],
          correct: 1
        }
      ]
    },
    {
      id: 3,
      name: "Level 3",
      unlocked: false,
      completed: false,
      questions: [
        {
          question: "Which is the largest ocean on Earth?",
          options: ["Atlantic", "Indian", "Arctic", "Pacific"],
          correct: 3
        }
      ]
    }
  ];

  // --- STATE ---
  let currentLevelIndex = 0;
  let currentQuestionIndex = 0;
  let selectedOptionIndex = null;
  let isAnswerChecked = false;

  // --- DOM ELEMENTS ---
  const pathScreen = document.getElementById('path-screen');
  const quizScreen = document.getElementById('quiz-screen');
  const pathContainer = document.getElementById('path-container');
  const questionText = document.getElementById('question-text');
  const optionsGrid = document.getElementById('options-grid');
  const progressBar = document.getElementById('progress-bar');
  const actionBtn = document.getElementById('action-btn');
  const quizFooter = document.getElementById('quiz-footer');
  const feedbackText = document.getElementById('feedback-text');

  // Initialize App
  renderPath();

  // --- PATH RENDER LOGIC ---
  function renderPath() {
    pathContainer.innerHTML = '';
    levels.forEach((level, index) => {
      const node = document.createElement('div');
      node.className = `level-node ${level.completed ? 'completed' : level.unlocked ? 'unlocked' : 'locked'}`;
      
      if (level.completed) node.innerHTML = '✓';
      else if (level.unlocked) node.innerHTML = '★';
      else node.innerHTML = '🔒';

      if (level.unlocked) {
        node.onclick = () => startQuiz(index);
      }

      pathContainer.appendChild(node);
    });

    // Auto-scroll to the bottom so Level 1 is focused on load
    setTimeout(() => {
      pathContainer.scrollTop = pathContainer.scrollHeight;
    }, 0);
  }

  // --- QUIZ LOGIC ---
  function startQuiz(levelIndex) {
    currentLevelIndex = levelIndex;
    currentQuestionIndex = 0;
    
    pathScreen.style.display = 'none';
    quizScreen.style.display = 'flex';
    
    loadQuestion();
  }

  function loadQuestion() {
    resetQuizState();
    
    const level = levels[currentLevelIndex];
    const q = level.questions[currentQuestionIndex];

    // Progress Bar
    const progressPercent = (currentQuestionIndex / level.questions.length) * 100;
    progressBar.style.width = `${progressPercent}%`;

    // Prompt & Choices
    questionText.innerText = q.question;
    optionsGrid.innerHTML = '';

    q.options.forEach((opt, idx) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      card.innerText = opt;
      card.onclick = () => selectOption(idx, card);
      optionsGrid.appendChild(card);
    });
  }

  function selectOption(index, cardElement) {
    if (isAnswerChecked) return;

    // Reset visually selected cards
    document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
    
    // Highlight choice
    cardElement.classList.add('selected');
    selectedOptionIndex = index;
    
    // Enable "Check" button
    actionBtn.disabled = false;
  }

  function handleAction() {
    if (!isAnswerChecked) {
      checkAnswer();
    } else {
      nextQuestion();
    }
  }

  function checkAnswer() {
    isAnswerChecked = true;
    const currentQ = levels[currentLevelIndex].questions[currentQuestionIndex];
    const isCorrect = selectedOptionIndex === currentQ.correct;

    if (isCorrect) {
      quizFooter.className = 'quiz-footer correct';
      feedbackText.innerText = 'Awesome!';
      actionBtn.className = 'btn-3d';
      actionBtn.innerText = 'Continue';
    } else {
      quizFooter.className = 'quiz-footer incorrect';
      feedbackText.innerText = `Correct answer: ${currentQ.options[currentQ.correct]}`;
      actionBtn.className = 'btn-3d btn-red';
      actionBtn.innerText = 'Got It';
    }
  }

  function nextQuestion() {
    currentQuestionIndex++;
    const level = levels[currentLevelIndex];

    if (currentQuestionIndex < level.questions.length) {
      loadQuestion();
    } else {
      // Level Completed!
      level.completed = true;
      if (levels[currentLevelIndex + 1]) {
        levels[currentLevelIndex + 1].unlocked = true;
      }
      exitQuiz();
    }
  }

  function resetQuizState() {
    isAnswerChecked = false;
    selectedOptionIndex = null;
    actionBtn.disabled = true;
    actionBtn.className = 'btn-3d';
    actionBtn.innerText = 'Check';
    quizFooter.className = 'quiz-footer';
    feedbackText.innerText = '';
  }

  function exitQuiz() {
    quizScreen.style.display = 'none';
    pathScreen.style.display = 'flex';
    renderPath();
  }
</script>

</body>
</html>
